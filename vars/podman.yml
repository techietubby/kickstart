---
# podman - AlmaLinux 9 Podman/IPA server.
# This host matches vars/defaults.yml, so there is nothing to tune here.
#   ansible-playbook provision-vm.yml -e vm=foreman1
vmName: podman

# --- identity ----------------------------------------------------------
ksTemplate: templates/{{ vmName }}.j2
autoStart: true

# --- sizing ----------------------------------------------------------
memoryUnit: MiB
memory: 8192
maxMemory: 8192
vcpu: 4
maxVcpus: 4
arch: x86_64

# --- OS / install source -------------------------------------------
osVer: almalinux9
osRelease: 9
osImage: /vms/software/AlmaLinux-9-latest-x86_64-dvd.iso
openScap: https://copr-be.cloud.fedoraproject.org/results/openscapmaint/openscap-latest/epel-{{ osRelease }}-x86_64/
# Kernel/installer args passed to virt-install --extra-args
extraArgs: inst.text inst.ks=file:/{{ vmName }}.ks console=ttyS0,115200n8 net.ifnames=0 biosdevname=0

# --- storage -------------------------------------------------------
rootVg: vg_system
poolLoc: /virt4
ksLoc: /var/www/html
diskFile: "{{ poolLoc }}/{{ vmName }}.qcow2"
diskType: qcow2
diskSize: 80
targetDev: vda

# --- boot --------------------------------------------------------
boot_dev:
  - cdrom
  - hd
bootMenu: true

# --- network ---------------------------------------------------
interfaceType: bridge
bridge: br0
bridgeType: virtio
macAddress: 52:54:00:c3:ed:47
netDevice: eth0
netIp: 192.168.0.47
netMask: 255.255.255.0
gateWay: 192.168.0.2
nS1: 192.168.0.50
nS2: 62.179.104.196
nS3: 213.46.228.196
nameServer: "{{ nS1 }},{{ nS2 }},{{ nS3 }}"
searchDM: persephone.online persephone.biz persephone.local
domName: persephone.online
hostName: "{{ vmName }}.{{ domName }}"

# --- locale --------------------------------------------------
vcKeymap: gb
xLayouts: gb
lang: en_GB.UTF-8
timeZone: Europe/Amsterdam

# --- credentials (values live in vars/vault.yml) ---------
rootPw: "{{ vault_root_pw_hash }}"
publicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAqMua/S8uiELO3duu5lVbhS0MDJniAVssOr7QHgANhU root@xeon.persephone.local

# --- firewall -----------------------------------------------
fwService:
  - dhcpv6-client
  - dns
  - freeipa-4
  - freeipa-ldap
  - freeipa-ldaps
  - freeipa-replication
  - freeipa-trust
  - http
  - https
  - ssh
fwPort:
  - 53/udp
  - 88/udp
  - 123/udp
  - 135/tcp
  - 138/tcp
  - 138/udp
  - 139/tcp
  - 139/udp
  - 389/udp
  - 445/tcp
  - 445/udp
  - 464/udp
  - 1024-1300/tcp
  - 3268/tcp
  - 19999/tcp

# --- LVM layout -------------------------------------------
# Per-host tuning: override these three scalars in vars/<vm>.yml
# rather than redeclaring the whole logVol list.
lvRootSize: 1024
lvUsrSize: 6192
lvVarSize: 4096
lvOptSize: 2048
lvHomeSize: 1024
lvTmpSize: 1024
lvVarAuditSize: 1024
lvVarLogSize: 1024
lvVarTmpSize: 1024

logVol:
  - mountPoint: /
    fsType: xfs
    lvName: lv_root
    lvSize: "{{ lvRootSize }}"
    fsOptions: none

  - mountPoint: /home
    fsType: xfs
    lvName: lv_home
    lvSize: "{{ lvHomeSize }}"
    fsOptions: defaults,nodev,nosuid

  - mountPoint: /opt
    fsType: xfs
    lvName: lv_opt
    lvSize: "{{ lvOptSize }}"
    fsOptions: defaults,nodev

  - mountPoint: /tmp
    fsType: xfs
    lvName: lv_tmp
    lvSize: "{{ lvTmpSize }}"
    fsOptions: defaults,nodev,nosuid,noexec

  - mountPoint: /usr
    fsType: xfs
    lvName: lv_usr
    lvSize: "{{ lvUsrSize }}"
    fsOptions: defaults,nodev

  - mountPoint: /var
    fsType: xfs
    lvName: lv_var
    lvSize: "{{ lvVarSize }}"
    fsOptions: defaults,nodev

  - mountPoint: /var/tmp
    fsType: xfs
    lvName: lv_var_tmp
    lvSize: "{{ lvVarTmpSize }}"
    fsOptions: defaults,nodev,nosuid,noexec

  - mountPoint: /var/log
    fsType: xfs
    lvName: lv_var_log
    lvSize: "{{ lvVarLogSize }}"
    fsOptions: defaults,nodev,nosuid,noexec

  - mountPoint: /var/log/audit
    fsType: xfs
    lvName: lv_audit
    lvSize: "{{ lvVarAuditSize }}"
    fsOptions: defaults,nodev,nosuid,noexec

userName:
  - name: ansible
    uid: 1001
    gecos: Ansible user
    groups: wheel
    password: "{{ rootPw }}"  # crypted hash, same as root
