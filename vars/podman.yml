---
# podman - AlmaLinux 9 Podman container host.
#   ansible-playbook provision-vm.yml -e vm=podman [-e rebuild=true]
# Only values that differ from vars/defaults.yml belong here.

# --- sizing ----------------------------------------------------------
memory: 8192
maxMemory: 8192

# --- OS / install source -------------------------------------------
osImage: /vms/software/AlmaLinux-9-latest-x86_64-dvd.iso
extraArgs: inst.text inst.ks=file:/{{ vmName }}.ks console=ttyS0,115200n8 net.ifnames=0 biosdevname=0

# --- storage -------------------------------------------------------
poolLoc: /virt4
diskSize: 80

# --- network ---------------------------------------------------
macAddress: 52:54:00:c3:ed:47
netIp: 192.168.0.47
hostName: "{{ vmName }}.{{ domName }}"

# --- firewall -----------------------------------------------
# Kickstart wants port:proto (not port/proto).
fwService:
  - dhcpv6-client
  - dns
  - freeipa-4
  - freeipa-ldap
  - freeipa-ldaps
  - freeipa-replication
  - freeipa-trust
  - http
  - https
  - ssh
fwPort:
  - 53:udp
  - 88:udp
  - 123:udp
  - 135:tcp
  - 138:tcp
  - 138:udp
  - 139:tcp
  - 139:udp
  - 389:udp
  - 445:tcp
  - 445:udp
  - 464:udp
  - 1024-1300:tcp
  - 3268:tcp
  - 19999:tcp

# --- LVM layout -------------------------------------------
# No swap and no /vms on this host, so the whole list is redeclared.
# /var/lib/containers (podman image/container storage) is marked grow: true
# and takes all VG space left after the fixed-size LVs (~50 GiB on 80 GiB).
lvRootSize: 1024
lvUsrSize: 6192
lvVarLogSize: 1024

logVol:
  - mountPoint: /
    fsType: xfs
    lvName: lv_root
    lvSize: "{{ lvRootSize }}"
    fsOptions: none

  - mountPoint: /home
    fsType: xfs
    lvName: lv_home
    lvSize: 1024
    fsOptions: defaults,nodev,nosuid

  - mountPoint: /opt
    fsType: xfs
    lvName: lv_opt
    lvSize: 2048
    fsOptions: defaults,nodev

  - mountPoint: /tmp
    fsType: xfs
    lvName: lv_tmp
    lvSize: 1024
    fsOptions: defaults,nodev,nosuid,noexec

  - mountPoint: /usr
    fsType: xfs
    lvName: lv_usr
    lvSize: "{{ lvUsrSize }}"
    fsOptions: defaults,nodev

  - mountPoint: /var
    fsType: xfs
    lvName: lv_var
    lvSize: 8192
    fsOptions: defaults,nodev

  - mountPoint: /var/lib/containers
    fsType: xfs
    lvName: lv_containers
    lvSize: 8192   # minimum; grows to fill the VG
    grow: true
    fsOptions: defaults,nodev

  - mountPoint: /var/tmp
    fsType: xfs
    lvName: lv_var_tmp
    lvSize: 1024
    fsOptions: defaults,nodev,nosuid,noexec

  - mountPoint: /var/log
    fsType: xfs
    lvName: lv_var_log
    lvSize: "{{ lvVarLogSize }}"
    fsOptions: defaults,nodev,nosuid,noexec

  - mountPoint: /var/log/audit
    fsType: xfs
    lvName: lv_audit
    lvSize: 1024
    fsOptions: defaults,nodev,nosuid,noexec
