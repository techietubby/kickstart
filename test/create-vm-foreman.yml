---
- name: Define VM
  hosts: localhost

  vars:
    vmName: foreman
    autoStart: true
    memoryUnit: MiB
    memory: 24576
    maxMemory: 24576
    vcpu: 4
    maxVcpus: 4
    arch: x86_64
    osVer: almalinux9
    osRelease: 8
    osImage: /vms/software/AlmaLinux-9.8-x86_64-dvd.iso
    rootVg: vg_system
    poolLoc: /virt
    ksLoc: /var/www/html
    boot_dev:
      - cdrom
      - hd
    bootMenu: true
    diskFile: "{{ poolLoc }}/{{ vmName }}.qcow2"
    diskType: qcow2
    diskSize: 350
    targetDev: vda
    interfaceType: bridge
    macAddress: 52:54:00:c3:f0:45
    bridge: br0
    bridgeType: virtio

    rootPw: ***REMOVED***
    vcKeymap: gb
    xLayouts: gb
    lang: en_GB.UTF-8
    timeZone: Europe/Amsterdam
    netDevice: eth0
    netIp: 192.168.0.49
    netMask: 255.255.255.0
    gateWay: 192.168.0.2
    nS1: 192.168.0.50
    nS2: 62.179.104.196
    nS3: 213.46.228.196
    searchDM: persephone.online persephone.biz persephone.local
    nameServer: "{{ nS1 }},{{ nS2 }},{{ nS3 }}"
    domName: persephone.online
    hostName: foreman.{{ domName }}
    # hostName:      "{{ vmName }}.{{ domName }}"
    openScap: https://copr-be.cloud.fedoraproject.org/results/openscapmaint/openscap-latest/epel-{{ osRelease }}-x86_64/

    publicKey: ssh-rsa
      
      root@localhost.localdomain

    fwService:
      - http
      - https
      - ssh
      - kerberos
      - mountd
      - nfs

    fwPort:
      - 22:tcp
      - 80:tcp
      - 443:tcp
      - 3306:tcp

    logVol:
      - mountPoint: /
        fsType: xfs
        lvName: lv_root
        lvSize: 2048
        fsOptions: none

      - mountPoint: swap
        fsType: swap
        lvName: lv_swap
        lvSize: 2048
        fsOptions: none

      - mountPoint: /home
        fsType: xfs
        lvName: lv_home
        lvSize: 1024
        fsOptions: defaults,nodev,nosuid

      - mountPoint: /opt
        fsType: xfs
        lvName: lv_opt
        lvSize: 2048
        fsOptions: defaults,nodev

      - mountPoint: /tmp
        fsType: xfs
        lvName: lv_tmp
        lvSize: 1024
        fsOptions: defaults,nodev,nosuid,noexec

      - mountPoint: /usr
        fsType: xfs
        lvName: lv_usr
        lvSize: 9216
        fsOptions: defaults,nodev

      - mountPoint: /var
        fsType: xfs
        lvName: lv_var
        lvSize: 204800
        fsOptions: defaults,nodev

      - mountPoint: /var/tmp
        fsType: xfs
        lvName: lv_var_tmp
        lvSize: 1024
        fsOptions: defaults,nodev,nosuid,noexec

      - mountPoint: /var/log
        fsType: xfs
        lvName: lv_var_log
        lvSize: 5120
        fsOptions: defaults,nodev,nosuid,noexec

      - mountPoint: /var/log/audit
        fsType: xfs
        lvName: lv_audit
        lvSize: 1024
        fsOptions: defaults,nodev,nosuid,noexec

      - mountPoint: /vms
        fsType: xfs
        lvName: lv_vms
        lvSize: 8192
        fsOptions: defaults,nodev

    userName:
      - name: ansible
        uid: 1001
        gecos: Ansible user
        groups: wheel

  tasks:
    - name: Copy kickstart file to HTTP server
      ansible.builtin.template:
        src: templates/{{ vmName }}.j2
        dest: "{{ ksLoc }}/{{ vmName }}.ks"
        owner: root
        group: root
        mode: "0644"
        setype: httpd_sys_content_t

    - name: Get list of VMs
      community.libvirt.virt:
        command: list_vms
      register: vms
      check_mode: false  # read-only; lets the `when` checks below work under --check

    - name: Ensure VM is destroyed
      community.libvirt.virt:
        name: "{{ vmName }}"
        state: destroyed
      when: vmName in vms.list_vms

    - name: UnDefine VM
      community.libvirt.virt:
        command: undefine
        name: "{{ vmName }}"
      when: vmName in vms.list_vms

    - name: Define and build VM
      changed_when: true
      ansible.builtin.shell: |
        virt-install --name={{ vmName }} --memory {{ memory }},maxmemory={{ maxMemory }} --vcpus {{ vcpu }},maxvcpus={{ maxVcpus }} \
        --disk path={{ poolLoc }}/{{ vmName }}.qcow2,size={{ diskSize }} \
        --os-variant={{ osVer }} --os-type linux \
        --network=bridge=br0,model=virtio,driver.iommu=on --graphics none \
        --console pty,target_type=serial \
        --location {{ osImage }} \
        --install kernel_args_overwrite=yes \
        --rng /dev/random,driver.iommu=on --graphics none \
        --initrd-inject={{ ksLoc }}/{{ vmName }}.ks \
        --extra-args="inst.text inst.ks=file:/{{ vmName }}.ks console=ttyS0,115200n8 serial net.ifnames=0 biosdevname=0" \
        --boot cdrom,hd,menu=on --accelerate

    - name: Start VM
      community.libvirt.virt:
        name: "{{ vmName }}"
        state: running
        autostart: "{{ autostart | default(false) }}"
    # uri: 'qemu:///'

    - name: Show VM status
      community.libvirt.virt:
        command: status
        name: "{{ vmName }}"

    - name: Show VM info (requires -v)
      community.libvirt.virt:
        command: info
        name: "{{ vmName }}"

    - name: Print console hint
      ansible.builtin.debug:
        msg: Enter virsh console {{ vmName }} to monitor the progress of the install
