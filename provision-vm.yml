---
# Generic libvirt VM builder driven by a per-host var file.
#
#   ansible-playbook provision-vm.yml -e vm=foreman
#
# Loads vars/defaults.yml then vars/<vm>.yml (the latter overrides) and, at
# run time, the ansible-vault encrypted vars/vault.yml. Renders the kickstart
# template <ksTemplate> to the local HTTP root, then rebuilds
# the domain with virt-install. Replaces the per-host create-vm-<name>.yml
# playbooks - add a new host by dropping a vars/<name>.yml file.

- name: Build libvirt VM from kickstart
  hosts: localhost
  gather_facts: false

  vars_files:
    - vars/defaults.yml
    - vars/{{ vm }}.yml

  tasks:
    - name: Load vaulted credentials
      # Loaded at run time, not via vars_files, so --syntax-check and
      # ansible-lint work without the vault password (e.g. in CI).
      ansible.builtin.include_vars:
        file: vars/vault.yml
      no_log: true

    - name: Assert a target VM was selected
      ansible.builtin.assert:
        that:
          - vm is defined
          - vm | length > 0
        fail_msg: Pass -e vm=<name> (expects vars/<name>.yml to exist)

    - name: Check install source ISO exists
      ansible.builtin.stat:
        path: "{{ osImage }}"
      register: iso_stat

    - name: Check kickstart template exists
      ansible.builtin.stat:
        path: "{{ ksTemplate }}"
      register: ks_tmpl_stat

    - name: Check storage pool directory exists
      ansible.builtin.stat:
        path: "{{ poolLoc }}"
      register: pool_stat

    - name: Assert preflight requirements are met
      ansible.builtin.assert:
        that:
          - iso_stat.stat.exists
          - ks_tmpl_stat.stat.exists
          - pool_stat.stat.isdir | default(false)
        fail_msg: >-
          Missing prerequisite - ISO {{ osImage }} exists={{ iso_stat.stat.exists }},
          template {{ ksTemplate }} exists={{ ks_tmpl_stat.stat.exists }},
          pool {{ poolLoc }} isdir={{ pool_stat.stat.isdir | default(false) }}

    - name: Copy kickstart file to HTTP server
      diff: false  # rendered file contains the IPA admin password
      ansible.builtin.template:
        src: "{{ ksTemplate }}"
        dest: "{{ ksLoc }}/{{ vmName }}.ks"
        owner: root
        group: root
        mode: "0644"
        setype: httpd_sys_content_t

    - name: Get list of VMs
      community.libvirt.virt:
        command: list_vms
      register: vms
      check_mode: false  # read-only; lets the `when` checks below work under --check

    - name: Ensure VM is destroyed
      community.libvirt.virt:
        name: "{{ vmName }}"
        state: destroyed
      when: vmName in vms.list_vms

    - name: UnDefine VM
      community.libvirt.virt:
        command: undefine
        name: "{{ vmName }}"
      when: vmName in vms.list_vms

    - name: Define and build VM
      changed_when: true
      ansible.builtin.shell: |
        virt-install --name={{ vmName }} --memory {{ memory }},maxmemory={{ maxMemory }} --vcpus {{ vcpu }},maxvcpus={{ maxVcpus }} \
        --disk path={{ diskFile }},size={{ diskSize }} \
        --os-variant={{ osVer }} --os-type linux \
        --network=bridge={{ bridge }},model={{ bridgeType }},mac={{ macAddress }},driver.iommu=on --graphics none \
        --console pty,target_type=serial \
        --location {{ osImage }} \
        --install kernel_args_overwrite=yes \
        --rng /dev/random,driver.iommu=on --graphics none \
        --initrd-inject={{ ksLoc }}/{{ vmName }}.ks \
        --extra-args="{{ extraArgs }}" \
        --boot {{ boot_dev | join(',') }},menu={{ 'on' if bootMenu else 'off' }} --accelerate
    - name: Start VM
      community.libvirt.virt:
        name: "{{ vmName }}"
        state: running
        autostart: "{{ autoStart | default(false) }}"
    # uri: 'qemu:///'

    - name: Show VM status
      community.libvirt.virt:
        command: status
        name: "{{ vmName }}"

    - name: Show VM info (requires -v)
      community.libvirt.virt:
        command: info
        name: "{{ vmName }}"

    - name: Print console hint
      ansible.builtin.debug:
        msg: Enter virsh console {{ vmName }} to monitor the progress of the install
