---
# Generic libvirt VM builder driven by a per-host var file.
#
#   ansible-playbook provision-vm.yml -e vm=foreman                 # new VM
#   ansible-playbook provision-vm.yml -e vm=foreman -e rebuild=true # wipe + reinstall
#
# Loads vars/defaults.yml then vars/<vm>.yml (the latter overrides) and, at
# run time, the ansible-vault encrypted vars/vault.yml. Refuses to touch an
# existing domain or disk unless rebuild=true. Renders the kickstart template
# <ksTemplate> to a private (0600) temp dir, injects it into the installer
# initrd with virt-install, then deletes it. Replaces the per-host create-vm-<name>.yml
# playbooks - add a new host by dropping a vars/<name>.yml file.

- name: Build libvirt VM from kickstart
  hosts: localhost
  gather_facts: false

  vars_files:
    - vars/defaults.yml
    - vars/{{ vm }}.yml

  tasks:
    - name: Load vaulted credentials
      # Loaded at run time, not via vars_files, so --syntax-check and
      # ansible-lint work without the vault password (e.g. in CI).
      ansible.builtin.include_vars:
        file: vars/vault.yml
      no_log: true

    - name: Assert a target VM was selected
      ansible.builtin.assert:
        that:
          - vm is defined
          - vm | length > 0
        fail_msg: Pass -e vm=<name> (expects vars/<name>.yml to exist)

    - name: Check install source ISO exists
      ansible.builtin.stat:
        path: "{{ osImage }}"
        get_checksum: false  # don't hash the whole ISO
      register: iso_stat

    - name: Check kickstart template exists
      ansible.builtin.stat:
        path: "{{ ksTemplate }}"
      register: ks_tmpl_stat

    - name: Check storage pool directory exists
      ansible.builtin.stat:
        path: "{{ poolLoc }}"
      register: pool_stat

    - name: Assert preflight requirements are met
      ansible.builtin.assert:
        that:
          - iso_stat.stat.exists
          - ks_tmpl_stat.stat.exists
          - pool_stat.stat.isdir | default(false)
        fail_msg: >-
          Missing prerequisite - ISO {{ osImage }} exists={{ iso_stat.stat.exists }},
          template {{ ksTemplate }} exists={{ ks_tmpl_stat.stat.exists }},
          pool {{ poolLoc }} isdir={{ pool_stat.stat.isdir | default(false) }}

    - name: Get list of VMs
      community.libvirt.virt:
        command: list_vms
      register: vms
      check_mode: false  # read-only; lets the `when` checks below work under --check

    - name: Check for an existing disk image
      ansible.builtin.stat:
        path: "{{ diskFile }}"
        get_checksum: false  # don't hash a multi-GB disk image
      register: disk_stat

    - name: Refuse to overwrite an existing VM or disk unless rebuild=true
      ansible.builtin.assert:
        that:
          - (vmName not in vms.list_vms and not disk_stat.stat.exists) or (rebuild | default(false) | bool)
        fail_msg: >-
          {{ vmName }} already exists (domain defined={{ vmName in vms.list_vms }},
          disk {{ diskFile }} exists={{ disk_stat.stat.exists }}). Re-run with
          -e rebuild=true to destroy it, delete its disk and reinstall.

    - name: Remove legacy kickstart copy from the HTTP root
      # Older runs published the rendered kickstart (with the IPA admin
      # password) world-readable under ksLoc. virt-install injects it into the
      # initrd (inst.ks=file:/...), so it never needs to be served over HTTP.
      ansible.builtin.file:
        path: "{{ ksLoc }}/{{ vmName }}.ks"
        state: absent

    - name: Ensure VM is destroyed
      community.libvirt.virt:
        name: "{{ vmName }}"
        state: destroyed
      when: vmName in vms.list_vms

    - name: UnDefine VM
      community.libvirt.virt:
        command: undefine
        name: "{{ vmName }}"
      when: vmName in vms.list_vms

    - name: Delete old disk image so diskSize takes effect
      ansible.builtin.file:
        path: "{{ diskFile }}"
        state: absent
      when: disk_stat.stat.exists

    - name: Render kickstart privately and build VM
      block:
        - name: Create private temp dir for the kickstart
          ansible.builtin.tempfile:
            state: directory
            suffix: -ks
          register: ks_tmp
          check_mode: false

        - name: Render kickstart file
          diff: false  # rendered file contains the IPA admin password
          ansible.builtin.template:
            src: "{{ ksTemplate }}"
            dest: "{{ ks_tmp.path }}/{{ vmName }}.ks"
            owner: root
            group: root
            mode: "0600"

        - name: Define and build VM
          changed_when: true
          vars:
            # ",cache=none,io=native,..." - empty/undefined settings are omitted
            disk_tuning: >-
              {%- for opt, val in {'cache': diskCache | default(''), 'io': diskIo | default(''),
                                   'discard': diskDiscard | default(''),
                                   'detect_zeroes': diskDetectZeroes | default('')}.items()
                  if val | string | length > 0 -%}
              ,{{ opt }}={{ val }}
              {%- endfor -%}
          ansible.builtin.shell: |
            virt-install --name={{ vmName }} --memory {{ memory }},maxmemory={{ maxMemory }} --vcpus {{ vcpu }},maxvcpus={{ maxVcpus }} \
            --disk path={{ diskFile }},size={{ diskSize }}{{ disk_tuning }} \
            --os-variant={{ osVer }} --os-type linux \
            --network=bridge={{ bridge }},model={{ bridgeType }},mac={{ macAddress }},driver.iommu=on --graphics none \
            --console pty,target_type=serial \
            --location {{ osImage }} \
            --install kernel_args_overwrite=yes \
            --rng /dev/random,driver.iommu=on --graphics none \
            --initrd-inject={{ ks_tmp.path }}/{{ vmName }}.ks \
            --extra-args="{{ extraArgs }}" \
            --boot {{ boot_dev | join(',') }},menu={{ 'on' if bootMenu else 'off' }} --accelerate
      always:
        - name: Remove rendered kickstart
          ansible.builtin.file:
            path: "{{ ks_tmp.path }}"
            state: absent
          when: ks_tmp.path is defined

    - name: Start VM
      community.libvirt.virt:
        name: "{{ vmName }}"
        state: running
        autostart: "{{ autoStart | default(false) }}"
    # uri: 'qemu:///'

    - name: Show VM status
      community.libvirt.virt:
        command: status
        name: "{{ vmName }}"

    - name: Show VM info (requires -v)
      community.libvirt.virt:
        command: info
        name: "{{ vmName }}"

    - name: Print console hint
      ansible.builtin.debug:
        msg: Enter virsh console {{ vmName }} to monitor the progress of the install
