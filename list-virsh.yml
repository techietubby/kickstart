---
- name: List VMs
  hosts: localhost

  tasks:
  # Listing VMs
    - name: List all VMs
      community.libvirt.virt:
        command: list_vms
      register: all_vms

    - name: List only running VMs
      community.libvirt.virt:
        command: list_vms
        state: running
      register: running_vms
